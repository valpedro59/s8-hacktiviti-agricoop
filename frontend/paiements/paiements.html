<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Paiements</title>
  <link rel="stylesheet" href="paiements.css">
</head>
<body>

  <!-- NAVIGATION — TODO (Dev FS4) -->

  <main>
    <!-- =====================================================================
         FORMULAIRE DE PAIEMENT — TODO (Dev FS4)

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="section-paiement">
      <span class="app-badge">Simplify</span>
      <h2>Enregistrer un paiement</h2>
      <form id="form-paiement" class="form-paiement">
        <div class="form-group">
          <label for="p-membre">Membre :</label>
          <select id="p-membre">
            <option value="">-- Choisir un membre --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="p-montant">Montant (FCFA) :</label>
          <input type="number" id="p-montant" min="1" placeholder="Ex: 5000">
        </div>
        <div class="form-group">
          <label for="p-mode-paiement">Mode de paiement :</label>
          <select id="p-mode-paiement">
            <option value="">-- Mode de paiement --</option>
            <option value="Espèces">Espèces</option>
            <option value="Mobile Money">Mobile Money</option>
          </select>
          <p class="texte-secondaire">Modes de paiement acceptés:
            <span class="badge-especes">Espèces</span> 
            <span class="badge-mobile-money">Mobile Money</span>
            <img src="images/mtn-momo.png" alt="MTN Mobile Money" class="logo-momo" width="46" height="46">
            <img src="images/airtel-money.png" alt="Airtel Money" class="logo-momo" width="46" height="46">
          </p>
        </div>
        <button type="submit" class="btn-primary">Enregistrer le paiement</button>
      </form>
      <div id="message-erreur-paiement" class="message message-erreur" hidden></div>
      <div id="message-succes-paiement" class="message message-succes" hidden></div>
    </section>

    <div id="message-erreur-paiement" hidden></div>
    <div id="message-succes-paiement" hidden></div>

    <!-- =====================================================================
         TOTAL ET HISTORIQUE — TODO (Dev FS4)

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="section-historique">
      <span class="app-badge">Simplify</span>
      <div class="total-paiements-container">
        <h2>Total des paiements</h2>
        <p id="total-paiments" class="total-montant">0 FCFA</p>
      </div>
      <h2>Historique des paiements</h2>
      <div class="table-container">
        <table class="table-paiements">
          <thead>
            <tr>
              <th>Membre</th>
              <th>Montant</th>
              <th>Mode de paiement</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="liste-paiements">

          </tbody>
        </table>
      </div>
    </section>

    <table>
      <thead>
        <!-- TODO (Dev FS4) : en-têtes (Membre, Montant, Mode de paiement, Date) -->
      </thead>
      <tbody id="liste-paiements"></tbody>
    </table>
  </main>

  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>

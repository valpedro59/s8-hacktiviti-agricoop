<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Gestion des comptes</title>
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <!-- Font -->

  <!-- FontAwesome Icon -->
  <script src="https://kit.fontawesome.com/54d5bf6eec.js" crossorigin="anonymous"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="comptes.css">
</head>
<body>

  <!-- NAVIGATION — TODO (Dev FS2) -->

  <main>
    <!-- =====================================================================
         RÉSERVÉ À LA SECRÉTAIRE — TODO (Dev FS2)
         Cette page ne devrait être utile qu'à la Secrétaire (rôle Admin).
         Afficher un avertissement si l'utilisateur connecté n'a pas ce
         rôle (voir main.js : la variable de session est lue depuis le
         stockage local du navigateur, clé "agricoop_utilisateur").

         *** NE PAS MODIFIER l'id ci-dessous ***
         ===================================================================== -->
    <div id="acces-refuse-comptes" hidden></div>

    <!-- =====================================================================
         FORMULAIRE NOUVEAU COMPTE — TODO (Dev FS2)
         Construire le formulaire de création de compte (nom d'utilisateur,
         mot de passe, rôle, nom complet). Le rôle est un menu déroulant à
         choix fermé (Président / Trésorière / Responsable dépôt / Membre —
         la Secrétaire ne recrée pas d'autre Secrétaire depuis cet écran).

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    
    
    <section class="card-container">
    
    <div class="card">
      <h2 class="card-title">Création de compte</h2>
      <p>Veuillez remplir le formulaire</p>
      <form id="form-nouveau-compte">
        <input type="text" id="c-nom-utilisateur" placeholder="Nom d'utilisateur">
        <input type="password" id="c-mot-de-passe" placeholder="Mot de passe temporaire">
        <input type="text" id="c-nom-complet" placeholder="Nom complet">
        <select id="c-role">
          <option value="">-- Choisir un rôle --</option>
          <option value="Président">Président</option>
          <option value="Trésorière">Trésorière</option>
          <option value="Responsable dépôt">Responsable dépôt</option>
          <option value="Membre">Membre</option>
        </select>
        <button type="submit">Créer le compte</button>
      </form>
    </div>
   
    <div id="message-erreur-compte" hidden></div>
    <div id="message-succes-compte" hidden></div>
    </section>

    <!-- =====================================================================
         LISTE DES COMPTES EXISTANTS — TODO (Dev FS2)
         Construire un tableau. Le contenu des <tr> est injecté par main.js.

         *** NE PAS MODIFIER l'id ci-dessous ***
         ===================================================================== -->

    <section class="liste-Membre">
    <table>
      <thead>
        <!-- TODO (Dev FS2) : en-têtes (Nom d'utilisateur, Nom complet, Rôle) -->
        <tr>
          <th>Nom d'utilisateur</th>
          <th>Nom complet</th>
          <th>Rôle</th>
        </tr>
      </thead>
      <tbody id="liste-comptes"></tbody>
    </table>
    </section>
  </main>

  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
